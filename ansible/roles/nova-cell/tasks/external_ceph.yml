---
- name: Check nova keyring file
  vars:
    keyring: "{{ item.cluster }}.client.{{ item.vms.user }}.keyring"
    paths:
      - "{{ node_custom_config }}/nova/{{ inventory_hostname }}/{{ keyring }}"
      - "{{ node_custom_config }}/nova/{{ keyring }}"
  stat:
    path: "{{ lookup('first_found', paths) }}"
  delegate_to: localhost
  register: nova_cephx_keyring_file
  failed_when: not nova_cephx_keyring_file.stat.exists
  when:
    - nova_backend == "rbd"
    - external_ceph_cephx_enabled | bool
    - item.vms is defined

- name: Check cinder keyring file
  vars:
    keyring: "{{ item.cluster }}.client.{{ item.volumes.user }}.keyring"
    paths:
      - "{{ node_custom_config }}/nova/{{ inventory_hostname }}/{{ keyring }}"
      - "{{ node_custom_config }}/nova/{{ keyring }}"
  stat:
    path: "{{ lookup('first_found', paths) }}"
  delegate_to: localhost
  register: cinder_cephx_keyring_file
  failed_when: not cinder_cephx_keyring_file.stat.exists
  when:
    - cinder_backend_ceph | bool
    - external_ceph_cephx_enabled | bool
    - item.volumes is defined

- name: Extract nova key from file
  set_fact:
    nova_cephx_raw_key: "{{ lookup('template', nova_cephx_keyring_file.stat.path) | regex_search('key\\s*=.*$', multiline=True) | regex_replace('key\\s*=\\s*(.*)\\s*', '\\1') }}"
  changed_when: false
  when:
    - nova_backend == "rbd"
    - external_ceph_cephx_enabled | bool
    - item.vms is defined

- name: Extract cinder key from file
  set_fact:
    cinder_cephx_raw_key: "{{ lookup('template', cinder_cephx_keyring_file.stat.path) | regex_search('key\\s*=.*$', multiline=True) | regex_replace('key\\s*=\\s*(.*)\\s*', '\\1') }}"
  changed_when: false
  when:
    - cinder_backend_ceph | bool
    - external_ceph_cephx_enabled | bool
    - item.volumes is defined

- name: Copy over ceph nova keyring file
  template:
    src: "{{ nova_cephx_keyring_file.stat.path }}"
    dest: "{{ node_config_directory }}/{{ var_service }}/"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0660"
  become: true
  with_items:
    - nova-compute
  loop_control:
    loop_var: var_service
  when:
    - inventory_hostname in groups[nova_cell_compute_group]
    - nova_backend == "rbd"
    - external_ceph_cephx_enabled | bool
    - item.vms is defined

- name: Copy over ceph cinder keyring file
  template:
    src: "{{ cinder_cephx_keyring_file.stat.path }}"
    dest: "{{ node_config_directory }}/{{ var_service }}/"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0660"
  become: true
  with_items: # NOTE: nova-libvirt does not need it
    - nova-compute
  loop_control:
    loop_var: var_service
  when:
    - inventory_hostname in groups[nova_cell_compute_group]
    - nova_backend == "rbd"
    - external_ceph_cephx_enabled | bool
    - item.volumes is defined

- name: Copy over ceph.conf
  vars:
    service: "{{ nova_cell_services[var_service] }}"
    paths:
      - "{{ node_custom_config }}/nova/{{ inventory_hostname }}/{{ item.cluster }}.conf"
      - "{{ node_custom_config }}/nova/{{ item.cluster }}.conf"
  template:
    src: "{{ lookup('first_found', paths) }}"
    dest: "{{ node_config_directory }}/{{ var_service }}/"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0660"
  become: true
  with_items:
    - nova-compute
    - nova-libvirt
  loop_control:
    loop_var: var_service
  when:
    - service | service_enabled_and_mapped_to_host
    - nova_backend == "rbd"

- block:
    - name: Ensure /etc/ceph directory exists (host libvirt)
      vars:
        paths:
          - "{{ node_custom_config }}/nova/{{ inventory_hostname }}/{{ item.cluster }}.conf"
          - "{{ node_custom_config }}/nova/{{ item.cluster }}.conf"
      file:
        path: "/etc/ceph/"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true

    - name: Copy over ceph.conf (host libvirt)
      vars:
        paths:
          - "{{ node_custom_config }}/nova/{{ inventory_hostname }}/{{ item.cluster }}.conf"
          - "{{ node_custom_config }}/nova/{{ item.cluster }}.conf"
      template:
        src: "{{ lookup('first_found', paths) }}"
        dest: "/etc/ceph/{{ item.cluster }}.conf"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
  when:
    - not enable_nova_libvirt_container | bool
    - inventory_hostname in groups[nova_cell_compute_group]
    - nova_backend == "rbd"

- block:
    - name: Ensuring libvirt secrets directory exists
      vars:
        service: "{{ nova_cell_services['nova-libvirt'] }}"
      file:
        path: "{{ libvirt_secrets_dir }}"
        state: "directory"
        owner: "{{ config_owner_user }}"
        group: "{{ config_owner_group }}"
        mode: "0770"
      become: true
      when: service | service_enabled_and_mapped_to_host

    - name: Pushing nova rbd secret xml for libvirt
      vars:
        service: "{{ nova_cell_services['nova-libvirt'] }}"
        secrets:
        uuid: "{{ lookup('vars', 'rbd_secret_uuid_' + item.name, default=rbd_secret_uuid) }}"
        secret_name: "ceph-ephemeral-nova-{{ item.name }}"
        description: "Ceph Client Secret for Ephemeral Storage (Nova)"
        enabled: "{{ nova_backend == 'rbd' }}"
      template:
        src: "secret.xml.j2"
        dest: "{{ libvirt_secrets_dir }}/{{ uuid }}.xml"
        owner: "{{ config_owner_user }}"
        group: "{{ config_owner_group }}"
        mode: "0600"
      become: true
      when:
        - service | service_enabled_and_mapped_to_host
        - enabled | bool
        - item.vms is defined
      notify: "{{ libvirt_restart_handlers }}"

    - name: Pushing nova cinder secret xml for libvirt
      vars:
        service: "{{ nova_cell_services['nova-libvirt'] }}"
        uuid: "{{ lookup('vars', 'cinder_rbd_secret_uuid_' + item.name, default=cinder_rbd_secret_uuid) }}"
        secret_name: "ceph-persistent-cinder-{{ item.name }}"
        description: "Ceph Client Secret for Persistent Storage (Cinder)"
        enabled: "{{ cinder_backend_ceph }}"
      template:
        src: "secret.xml.j2"
        dest: "{{ libvirt_secrets_dir }}/{{ uuid }}.xml"
        owner: "{{ config_owner_user }}"
        group: "{{ config_owner_group }}"
        mode: "0600"
      become: true
      when:
        - service | service_enabled_and_mapped_to_host
        - enabled | bool
        - item.volumes is defined
      notify: "{{ libvirt_restart_handlers }}"

    - name: Pushing rbd secrets key for libvirt
      vars:
        service: "{{ nova_cell_services['nova-libvirt'] }}"
        uuid: "{{ rbd_secret_uuid }}"
        result: "{{ nova_cephx_raw_key | default }}"
        enabled: "{{ nova_backend == 'rbd' }}"
      template:
        src: "libvirt-secret.j2"
        dest: "{{ libvirt_secrets_dir }}/{{ uuid }}.base64"
        owner: "{{ config_owner_user }}"
        group: "{{ config_owner_group }}"
        mode: "0600"
      become: true
      when:
        - service | service_enabled_and_mapped_to_host
        - enabled | bool
        - external_ceph_cephx_enabled | bool
        - item.vms is defined
        # NOTE(yoctozepto): 'default' filter required due to eager evaluation of item content
        # which will be undefined if the applicable condition is False
      notify: "{{ libvirt_restart_handlers }}"
      no_log: True

    - name: Pushing cinder secrets key for libvirt
      vars:
        service: "{{ nova_cell_services['nova-libvirt'] }}"
        uuid: "{{ lookup('vars', 'cinder_rbd_secret_uuid_' + item.name, default=cinder_rbd_secret_uuid) }}"
        result: "{{ cinder_cephx_raw_key | default }}"
        enabled: "{{ cinder_backend_ceph }}"
      template:
        src: "libvirt-secret.j2"
        dest: "{{ libvirt_secrets_dir }}/{{ uuid }}.base64"
        owner: "{{ config_owner_user }}"
        group: "{{ config_owner_group }}"
        mode: "0600"
      become: true
      when:
        - service | service_enabled_and_mapped_to_host
        - enabled | bool
        - external_ceph_cephx_enabled | bool
        - item.volumes is defined
        # NOTE(yoctozepto): 'default' filter required due to eager evaluation of item content
        # which will be undefined if the applicable condition is False
      notify: "{{ libvirt_restart_handlers }}"
      no_log: True

  vars:
    libvirt_secrets_dir: >-
      {{ (node_config_directory ~ '/nova-libvirt/secrets')
         if enable_nova_libvirt_container | bool
         else '/etc/libvirt/secrets' }}
    # NOTE(mgoddard): When running libvirt as a host daemon, on CentOS it
    # appears to pick up secrets automatically, while on Ubuntu it requires a
    # reload. This may be due to differences in tested versions of libvirt
    # (8.0.0 vs 6.0.0). Reload should be low overhead, so do it always.
    libvirt_restart_handlers: >-
      {{ ['Restart nova-libvirt container']
         if enable_nova_libvirt_container | bool else
         ['Reload libvirtd'] }}
